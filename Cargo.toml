[package]
name = "flow-collector"
version = "0.0.2"
edition = "2024"

[dependencies]
netflow_parser = "1.0.6"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", features = ["full"] }
simplelog = "0.12.2"
ctrlc = "3.5.2"
flexi_logger = "0.31.10"
log = "0.4.34"
futures = "0.3.34"
bytes = "1.12.1"
lazy_static = "1.5.1"

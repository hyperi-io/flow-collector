[package]
name = "flow-collector"
version = "1.1.0"
edition = "2024"
license = "MIT"

[dependencies]
netflow_parser = "1.0.6"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
simplelog = "0.12.2"
ctrlc = "3.5.2"
flexi_logger = "0.31.10"
log = "0.4.34"
futures = "0.3.34"
bytes = "1.12.1"
lazy_static = "1.5.1"
